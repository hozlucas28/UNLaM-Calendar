"github":
  - changed-files:
      - any-glob-to-any-file:
          - .github/ISSUE_TEMPLATE/**/*
          - .github/CODEOWNERS
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/PULL_REQUEST_TEMPLATE.md
          - .github/renovate.json

"github actions":
  - changed-files:
      - any-glob-to-any-file: .github/workflows/**/*.yml

"frontend":
  - changed-files:
      - any-glob-to-any-file:
          - frontend/**/*
          - "!frontend/bun.lock"
          - "!frontend/package.json"

"frontend dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - frontend/bun.lock
          - frontend/package.json

"backend":
  - changed-files:
      - any-glob-to-any-file:
          - backend/**/*
          - "!backend/go.mod"
          - "!backend/go.sum"

"backend dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - backend/go.mod
          - backend/go.sum

"scripts":
  - changed-files:
      - any-glob-to-any-file: "**/*.sh"

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - .github/docs/**/*

"devcontainer":
  - changed-files:
      - any-glob-to-any-file: .devcontainer/**/*
